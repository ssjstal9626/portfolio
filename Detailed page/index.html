<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1400px">
    <title>울트라 알로에 쿨링 선크림</title>
    <link rel="icon" href="./images/fabicon.png" type="image/x-icon">
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css"
        rel="stylesheet">
</head>

<body>
    <!-- BUTTON -->
    <ul class="btn">
        <li><a href="./index.html" class="button">TOP</a></li>
        <li><a href="../index.html#Artwork" class="button">HOME</a></li>
    </ul>
    <!-- HEADER -->
    <div id="header">
        <div class="header_wrap">
            <h1 class="logo">
                <a href="./index.html"><img src="./images/logo.png" alt="logo"></a>
            </h1>
        </div>
    </div>
    <!-- GNB -->
    <div id="gnb">
        <div class="gnb_wrap">
            <ul class="gnb">
                <li><a href="#">베스트</a></li>
                <li><a href="#">화장품</a>
                    <ul class="subgnb">
                        <li><a href="#" class="line">선케어</a></li>
                        <li><a href="#">스킨케어</a></li>
                    </ul>
                </li>
                <li><a href="#">공지사항</a></li>
                <li><a href="#">이벤트</a></li>
            </ul>
        </div>
    </div>
    <!-- MAIN -->
    <div id="main">
        <div class="main_wrap">
            <div class="left">
                <div class="text_wrap">
                    <h2>저자극 진정 쿨링 울트라 알로에 쿨링 선크림 SPF50+/PA+++</h2>
                    <div class="hashtag">
                        <h4>#수분충전_알로에</h4>
                        <h4>#촉촉진정_쿨링</h4>
                        <h4>#예민한피부도안심</h4>
                    </div>
                    <div class="num">
                        <p class="percent">20%</p>
                        <p class="one">32,000</p>
                        <p class="two">25,600<span>원</span></p>
                    </div>
                    <div id="number">
                        <div class="about_price">
                            <div class="price"> 가격 : <span>25,600</span>원</div>
                            <div class="quantity">
                                <div class="numb_box">
                                    <input type="number" min="1" max="9" step="1" value="1">
                                </div>
                            </div>
                            <div class="total_price">
                                <p class="totaltext">총 구매 가격<span class="total"></span>원</p>
                            </div>
                        </div>
                    </div>
                    <ul class="go">
                        <li>
                        <a href="#">
                            <div class="gift">
                                <div class="giftsize"><img src="./images/gift.png" alt="giftimg"></div>
                                <div class="gifthover"><img src="./images/gifthover.png" alt="giftimg"></div>
                                선물하기
                            </div>
                        </a>
                        </li>
                        <li>
                        <a href="#">
                            <div class="parcel">
                                <div class="parcelsize"><img src="./images/parcel.png" alt="giftimg"></div>
                                <div class="parcelhover"><img src="./images/parcelhover.png" alt="giftimg"></div>
                                장바구니</div>
                        </a>
                        </li>
                        <li>
                        <a href="#">
                            <div class="get">구매하기</div>
                        </a>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="right">
                <img src="./images/page.png" alt="detail">
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-2.2.4.min.js"
        integrity="sha256-BbhdlvQf/xTY9gja0Dq3HiwQF8LaCRTXxZKRutelT44=" crossorigin="anonymous"></script>
    <script src="./js/script.js"></script>

</body>

</html>
